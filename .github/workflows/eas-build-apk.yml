name: EAS APK Build (production-apk)
# 수동 실행 또는 main 브랜치 푸시 시 자동 실행
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS 빌드 프로파일"
        required: true
        default: "production-apk"
        type: choice
        options:
          - production-apk
          - preview
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "components/**"
      - "app.config.ts"
      - "eas.json"
      - ".github/workflows/eas-build-apk.yml"
jobs:
  build:
    name: EAS Android APK Build
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[submit-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4
      - name: Node.js 22 설정
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: pnpm 설치
        uses: pnpm/action-setup@v4
        with:
          version: "9.12.0"
      - name: 의존성 설치
        run: pnpm install --frozen-lockfile
      - name: EAS CLI 설치
        run: npm install -g eas-cli@latest
      - name: EAS 로컬 APK 빌드
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          mkdir -p artifacts
          eas build \
            --platform android \
            --profile ${{ github.event.inputs.profile || 'production-apk' }} \
            --local \
            --non-interactive \
            --freeze-credentials \
            --output ./artifacts/future-energy-heating-v1.1.14.apk
      - name: APK 산출물 보관
        uses: actions/upload-artifact@v4
        with:
          name: future-energy-heating-v1.1.14-android
          path: artifacts/future-energy-heating-v1.1.14.apk
          if-no-files-found: error
          retention-days: 30
      - name: 빌드 완료 안내
        run: |
          echo "=========================================="
          echo "✅ Android APK 로컬 빌드가 완료됐습니다."
          echo ""
          echo "📱 이 GitHub Actions 실행의 Artifacts에서 APK를 다운로드하세요."
          echo "=========================================="

name: Submit existing iOS build to TestFlight

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: Existing successful EAS iOS build ID
        required: false
        default: 30183596-9e7d-4031-be2e-2e5cab1e6bc8
  push:
    branches:
      - main
    paths:
      - ".github/workflows/eas-submit-existing-ios.yml"

permissions:
  contents: read

jobs:
  submit:
    name: Submit existing iOS build
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[submit-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 22 설정
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: pnpm 설치
        uses: pnpm/action-setup@v4
        with:
          version: "9.12.0"

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: EAS CLI 설치
        run: npm install -g eas-cli@latest

      - name: 기존 빌드를 TestFlight에 제출
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          REQUESTED_BUILD_ID: ${{ inputs.build_id }}
        run: |
          BUILD_ID="$REQUESTED_BUILD_ID"
          if [ -z "$BUILD_ID" ]; then
            BUILD_ID="30183596-9e7d-4031-be2e-2e5cab1e6bc8"
          fi

          eas submit \
            --platform ios \
            --profile testflight \
            --id "$BUILD_ID" \
            --non-interactive \
            --wait
